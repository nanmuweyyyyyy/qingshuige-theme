<!doctype html>
<html lang="{{ site.Language.LanguageCode | default `zh-Hans` }}" dir="{{ or site.Language.Direction `ltr` }}">
<head>
  {{ partial "head.html" . }}
</head>
<body class="site-shell page-kind-{{ .Kind }}{{ with .Section }} section-{{ . | urlize }}{{ end }}">
  <a class="skip-link" href="#main-content">跳到正文</a>

  {{ partial "site/header.html" . }}

  <main id="main-content" class="site-main">
    {{ block "main" . }}{{ end }}
  </main>

  {{ partial "site/footer.html" . }}
  {{ partial "site/scripts.html" . }}
</body>
</html>
