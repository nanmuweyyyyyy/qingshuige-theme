{{ define "main" }}
<div class="site-container page-taxonomy">
  <header class="page-header">
    <h1>{{ .Title }}</h1>
    {{- with .Content -}}<div class="prose">{{ . }}</div>{{- end -}}
  </header>

  <ul class="taxonomy-list">
    {{- range .Pages -}}
      <li><a href="{{ .RelPermalink }}">{{ .LinkTitle }}</a></li>
    {{- end -}}
  </ul>
</div>
{{ end }}
