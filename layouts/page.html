{{ define "main" }}

    {{ if .Params.pdf }}

        {{ partial "document/pdf-viewer.html" . }}

    {{ else }}

        <article class="page">

            <header class="page__header">

                <h1 class="page__title">
                    {{ .Title }}
                </h1>

            </header>


            <div class="page__content">
                {{ .Content }}
            </div>

        </article>

    {{ end }}

{{ end }}
