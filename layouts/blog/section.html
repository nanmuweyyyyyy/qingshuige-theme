{{ define "main" }}

<div class="site-container page-home">

  <section
    class="home-recent"
    aria-labelledby="blog-title"
  >

    <header class="home-recent__header">

      <h1
        id="blog-title"
        class="home-recent__title"
      >
        全部文章
      </h1>

    </header>

    {{/* 获取 blog 下的全部文章 */}}
    {{- $pages := where site.RegularPages "Section" "blog" -}}
    {{- $pages = $pages.ByDate.Reverse -}}

    {{- if $pages }}

      <div class="home-post-grid">

        {{- range $pages }}

          {{ partial "home/article-card.html" . }}

        {{- end }}

      </div>

    {{- else }}

      <p class="home-recent__empty">
        暂时还没有文章。
      </p>

    {{- end }}

  </section>

</div>

{{ end }}
