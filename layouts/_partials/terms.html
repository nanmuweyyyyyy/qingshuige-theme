{{- $page := .page -}}
{{- $taxonomy := .taxonomy -}}
{{- with $page.GetTerms $taxonomy -}}
  <div class="article-terms" aria-label="{{ $taxonomy }}">
    <span class="article-terms__label">{{ (index . 0).Parent.LinkTitle }}：</span>
    <ul class="article-terms__list">
      {{- range . -}}
        <li><a href="{{ .RelPermalink }}">{{ .LinkTitle }}</a></li>
      {{- end -}}
    </ul>
  </div>
{{- end -}}
